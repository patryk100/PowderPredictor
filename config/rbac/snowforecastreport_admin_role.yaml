# This rule is not used by the project powderpredictor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over weather.powderpredictor.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: powderpredictor
    app.kubernetes.io/managed-by: kustomize
  name: snowforecastreport-admin-role
rules:
- apiGroups:
  - weather.powderpredictor.io
  resources:
  - snowforecastreports
  verbs:
  - '*'
- apiGroups:
  - weather.powderpredictor.io
  resources:
  - snowforecastreports/status
  verbs:
  - get
