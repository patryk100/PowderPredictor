---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - weather.powderpredictor.io
  resources:
  - resorttargets
  - snowforecastreports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - weather.powderpredictor.io
  resources:
  - resorttargets/finalizers
  verbs:
  - update
- apiGroups:
  - weather.powderpredictor.io
  resources:
  - resorttargets/status
  - snowforecastreports/status
  verbs:
  - get
  - patch
  - update
