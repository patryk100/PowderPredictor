---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-weather-powderpredictor-io-v1alpha1-resorttarget
  failurePolicy: Fail
  name: mresorttarget-v1alpha1.kb.io
  rules:
  - apiGroups:
    - weather.powderpredictor.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - resorttargets
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-weather-powderpredictor-io-v1alpha1-resorttarget
  failurePolicy: Fail
  name: vresorttarget-v1alpha1.kb.io
  rules:
  - apiGroups:
    - weather.powderpredictor.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - resorttargets
  sideEffects: None
